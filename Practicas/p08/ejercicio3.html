
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Combinación de filas</title>
    <style type="text/css">
        td, th { border: 1px solid #CCC; }
        table { border: 1px solid black; }
    </style>
</head>
<body>
    <h1>Ejercicio 3: Combinación de filas</h1>

    <table>
        <tr>
            <td>apples</td>
            <td rowspan="3">oranges</td>
            <td>pears</td>
        </tr>
        <tr>
            <td>bananas</td>
            <td rowspan="2">pineapple</td>
        </tr>
        <tr>
            <td>lychees</td>
        </tr>
    </table>
</body>
</html>
